<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallboard</title>
<style>
  :root {
    --bg:#05080d; --panel:rgba(18,26,38,.72); --line:rgba(120,160,210,.14);
    --ok:#2bff88; --down:#ff3860; --warn:#ffb020; --maint:#3ba0ff;
    --mut:#6b7f95; --txt:#e8f0fa;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(59,160,255,.13), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(43,255,136,.08), transparent 60%),
      var(--bg);
    color: var(--txt); font: 16px/1.3 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body.idle, body.idle * { cursor: none; }

  /* pages : glisser horizontalement (tactile / trackpad) ou flèches du clavier */
  #pager { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; position: relative; z-index: 1; }
  #pager::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; min-width: 0; min-height: 0; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; overflow: hidden; }
  #dots { position: fixed; bottom: .5vh; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 6px; }
  #dots i { width: 28px; height: 18px; display: grid; place-items: center; cursor: pointer; }
  #dots i::before { content:""; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); transition: all .3s; }
  #dots i.on::before { width: 22px; border-radius: 4px; background: var(--txt); }
  #nb-main { overflow-y: auto; scrollbar-width: none; padding-bottom: 3vh; }
  #nb-main::-webkit-scrollbar { display: none; }
  #nb-grid { display: grid; gap: 1.4vmin; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-content: start; }
  .nb-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.2vh 1.2vw; }
  .nb-card.has { border-color: rgba(43,255,136,.35); box-shadow: 0 0 18px rgba(43,255,136,.08); }
  .nb-h { display: flex; align-items: center; gap: 1ch; font-weight: 800; font-size: clamp(15px, 2.5vh, 28px); margin-bottom: .6vh; }
  .nb-h em { margin-left: auto; font-style: normal; font-size: .6em; font-weight: 700; letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .nb-card.has .nb-h em { color: var(--ok); }
  .nb-r { display: flex; align-items: baseline; gap: 1.2ch; padding: .6vh 0; border-top: 1px solid var(--line); font-size: clamp(12px, 1.9vh, 20px); }
  .nb-r .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .nb-r .ds { color: var(--mut); font-variant-numeric: tabular-nums; font-size: .85em; }
  .nb-r .tx { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .nb-r.open .tx { color: var(--ok); } .nb-r.closing .tx { color: var(--warn); } .nb-r.soon .tx { color: var(--maint); }
  .nb-r.closed, .nb-r.unknown { opacity: .5; }
  .placeholder { margin: auto; color: var(--mut); letter-spacing: .3em; text-transform: uppercase; }
  /* grille façon radar en fond */
  body::before {
    content:""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; opacity: .25;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
  }
  /* voile rouge pulsant quand il y a une panne */
  body.alert::after {
    content:""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 6vmin rgba(255,56,96,.16); animation: vignette 6s ease-in-out infinite;
  }
  @keyframes vignette { 50% { box-shadow: inset 0 0 9vmin rgba(255,56,96,.26); } }

  header, main { position: relative; z-index: 1; }
  header { display: flex; align-items: center; gap: 2.5vw; padding: 1.6vh 2.5vw; flex: 0 0 auto; }
  .ring { position: relative; width: clamp(70px, 11vh, 130px); aspect-ratio: 1; flex: 0 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .ring .bg { stroke: rgba(255,255,255,.07); }
  .ring .fg { stroke: var(--ok); transition: stroke-dasharray .8s, stroke .5s; filter: drop-shadow(0 0 6px currentColor); color: var(--ok); }
  .ring.bad .fg { stroke: var(--down); color: var(--down); }
  .ring.warn .fg { stroke: var(--warn); color: var(--warn); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: clamp(14px, 2.6vh, 30px); font-variant-numeric: tabular-nums; }
  .titles { flex: 1; min-width: 0; }
  .titles h1 { font-size: clamp(18px, 3.4vh, 40px); font-weight: 800; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titles .sub { color: var(--mut); font-size: clamp(11px, 1.6vh, 18px); text-transform: uppercase; letter-spacing: .25em; margin-top: .4vh; }
  .stats { display: flex; gap: clamp(10px, 2vw, 32px); }
  .stat { text-align: center; min-width: 4.5ch; }
  .stat b { display: block; font-size: clamp(24px, 5.2vh, 64px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat span { font-size: clamp(9px, 1.3vh, 14px); letter-spacing: .2em; color: var(--mut); text-transform: uppercase; }
  .stat.ok b { color: var(--ok); text-shadow: 0 0 18px rgba(43,255,136,.45); }
  .stat.down b { color: var(--down); text-shadow: 0 0 18px rgba(255,56,96,.6); }
  .stat.warn b { color: var(--warn); text-shadow: 0 0 18px rgba(255,176,32,.5); }
  .stat.zero b { color: #2a3647; text-shadow: none; }
  .clock { text-align: right; font-variant-numeric: tabular-nums; }
  .clock b { display: block; font-size: clamp(22px, 5vh, 60px); font-weight: 300; letter-spacing: .04em; }
  .clock span { color: var(--mut); font-size: clamp(10px, 1.5vh, 16px); text-transform: capitalize; }

  main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 1.6vh; padding: 0 2.5vw 2vh; overflow: hidden; }
  #banner { display: none; background: var(--down); color: #fff; font-weight: 800; text-align: center; padding: 1.2vh; border-radius: 10px; font-size: clamp(14px, 2.2vh, 26px); }
  #incident { display: none; background: rgba(255,176,32,.12); border: 1px solid var(--warn); color: #ffe3a3; padding: 1vh 1.5vw; border-radius: 10px; }

  .sec { font-size: clamp(10px, 1.4vh, 15px); letter-spacing: .3em; text-transform: uppercase; color: var(--mut); margin-bottom: 1vh; display: flex; align-items: center; gap: 1ch; }
  .sec::after { content:""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .sec.red { color: var(--down); }

  #problems { display: grid; gap: 1.4vmin; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  #probwrap { flex: 0 0 auto; max-height: 60vh; overflow-y: auto; scrollbar-width: none; }
  #probwrap::-webkit-scrollbar { display: none; }
  /* beaucoup d'alertes : cartes réduites au strict nécessaire */
  #problems.dense .card { padding: .7vh .9vw; }
  #problems.dense .m, #problems.dense .hist, #problems.dense .grp { display: none; }
  #problems.dense .n { font-size: clamp(14px, 2.1vh, 22px); }
  #problems.dense .dur { font-size: clamp(13px, 2vh, 22px); padding-top: .5vh; }
  .card {
    position: relative; overflow: hidden; border-radius: 14px; padding: 1.2vh 1.1vw;
    display: flex; flex-direction: column;
    background: linear-gradient(135deg, rgba(255,56,96,.24), rgba(255,56,96,.08)), var(--panel);
    border: 1px solid rgba(255,56,96,.6); box-shadow: 0 0 16px rgba(255,56,96,.20), inset 0 0 24px rgba(255,56,96,.06);
    animation: glow 4s ease-in-out infinite;
  }
  .card.warn { background: linear-gradient(135deg, rgba(255,176,32,.28), rgba(255,176,32,.08)), var(--panel); border-color: rgba(255,176,32,.7); box-shadow: 0 0 22px rgba(255,176,32,.3); animation: none; }
  .card.maint { background: linear-gradient(135deg, rgba(59,160,255,.26), rgba(59,160,255,.08)), var(--panel); border-color: rgba(59,160,255,.7); box-shadow: 0 0 22px rgba(59,160,255,.3); animation: none; }
  @keyframes glow { 50% { box-shadow: 0 0 26px rgba(255,56,96,.38), inset 0 0 32px rgba(255,56,96,.10); } }
  .card.fresh { animation: pop .6s cubic-bezier(.2,1.6,.4,1), glow 4s ease-in-out infinite .6s; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .card .tag { font-size: clamp(9px, 1.2vh, 13px); letter-spacing: .22em; font-weight: 800; color: var(--down); text-transform: uppercase; }
  .card.warn .tag { color: var(--warn); } .card.maint .tag { color: var(--maint); }
  .card .n { font-size: clamp(16px, 2.7vh, 30px); font-weight: 800; margin-top: .3vh; overflow-wrap: anywhere; line-height: 1.05; }
  .card .grp { color: var(--mut); font-size: clamp(10px, 1.3vh, 14px); margin-top: .3vh; }
  .card .dur { font-size: clamp(16px, 2.8vh, 34px); font-weight: 300; font-variant-numeric: tabular-nums; margin-top: auto; padding-top: 1.2vh; }
  .card .m { margin-top: .5vh; color: #ffd0d8; font-size: clamp(10px, 1.4vh, 15px); font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; opacity: .9; }
  .hist { display: flex; gap: 2px; height: clamp(8px, 1.4vh, 16px); margin-top: 1.2vh; }
  .hist i { flex: 1; border-radius: 2px; background: #243142; }
  .hist i.u { background: var(--ok); opacity: .7; } .hist i.d { background: var(--down); } .hist i.p { background: var(--warn); } .hist i.m { background: var(--maint); }

  .ack { margin-top: 1vh; width: 100%; min-height: 46px; border: 1px solid rgba(255,255,255,.35); border-radius: 12px; background: rgba(255,255,255,.10); color: #fff; font-family: inherit; font-weight: 700; font-size: clamp(13px, 1.9vh, 20px); letter-spacing: .06em; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .ack:active { background: rgba(255,255,255,.28); transform: scale(.98); }
  #acked { display: flex; flex-wrap: wrap; gap: 1vmin; }
  .chip { display: flex; align-items: center; gap: 1.2ch; min-height: 44px; padding: .6vh 1.2vw; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,56,96,.35); color: var(--mut); font-size: clamp(11px, 1.7vh, 18px); cursor: pointer; touch-action: manipulation; }
  .chip.warn { border-color: rgba(255,176,32,.4); }
  .chip b { color: var(--txt); font-weight: 700; }
  .chip i { font-style: normal; font-variant-numeric: tabular-nums; }
  .chip::before { content:""; width: .6em; height: .6em; border-radius: 50%; background: var(--down); opacity: .7; }
  .chip.warn::before { background: var(--warn); }

  #okwrap { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .groups { display: grid; gap: 1.6em 1.6em; font-size: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24em), 1fr)); align-content: start; }
  .gname { font-size: .7em; color: var(--mut); letter-spacing: .15em; text-transform: uppercase; margin-bottom: .5em; font-weight: 700; }
  .tiles { display: grid; gap: .4em; grid-template-columns: repeat(auto-fill, minmax(10em, 1fr)); }
  .tile { display: flex; align-items: center; gap: .6ch; background: var(--panel); border: 1px solid var(--line); border-radius: .45em; padding: .45em .6em; font-size: 1em; white-space: nowrap; overflow: hidden; }
  .tile::before { content:""; flex: 0 0 auto; width: .6em; height: .6em; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .tile span { overflow: hidden; text-overflow: ellipsis; }
  /* historique discret : fine barre en bas de la tuile, quasi invisible tant que tout va bien */
  .tile { position: relative; padding-bottom: calc(.45em + 4px); }
  .tile .th { position: absolute; left: .6em; right: .6em; bottom: 3px; height: 3px; display: flex; gap: 1px; }
  .tile .th i { flex: 1; border-radius: 1px; background: rgba(43,255,136,.16); }
  .tile .th i.d { background: var(--down); } .tile .th i.p { background: var(--warn); } .tile .th i.m { background: var(--maint); }
  /* un incident récent (dernières vérifications ou 24 h) : liseré et point orange + disponibilité */
  .tile.had { border-color: rgba(255,176,32,.45); }
  .tile.had::before { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .tile small { margin-left: auto; flex: 0 0 auto; font-size: .82em; font-variant-numeric: tabular-nums; color: var(--warn); }
  .tile small.bad { color: var(--down); }

  footer { position: relative; z-index: 1; flex: 0 0 auto; display: flex; gap: 2.5vw; align-items: center; padding: 1vh 2.5vw 1.4vh; border-top: 1px solid var(--line); background: rgba(8,12,18,.6); font-size: clamp(10px, 1.6vh, 17px); color: var(--mut); white-space: nowrap; overflow: hidden; }
  footer .k { display: flex; flex-direction: column; min-width: 0; }
  footer .k span { font-size: .72em; letter-spacing: .2em; text-transform: uppercase; }
  footer .k b { color: var(--txt); font-weight: 700; font-size: 1.25em; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  footer .k b.good { color: var(--ok); } footer .k b.bad { color: var(--down); } footer .k b.mid { color: var(--warn); }
  footer .sp { flex: 1; }
  .live { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: var(--ok); margin-right: .8ch; animation: breathe 2s ease-in-out infinite; }
  .live.stale { background: var(--down); animation: none; }

  #allgood { display: none; text-align: center; padding: 3vh 0 1vh; }
  #allgood b { display: block; font-size: clamp(22px, 5.5vh, 70px); font-weight: 800; color: var(--ok); text-shadow: 0 0 30px rgba(43,255,136,.5); letter-spacing: .08em; animation: breathe 4s ease-in-out infinite; }
  #allgood span { color: var(--mut); letter-spacing: .3em; font-size: clamp(10px, 1.6vh, 18px); text-transform: uppercase; }
  @keyframes breathe { 50% { opacity: .65; } }
</style>
</head>
<body>
<div id="pager">
<section class="page" id="page-status">
<header>
  <div class="ring" id="ring">
    <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="fg" cx="50" cy="50" r="44" stroke-dasharray="0 276.5"/></svg>
    <div class="pct" id="pct">–</div>
  </div>
  <div class="titles"><h1 id="title">Pegase Monitoring</h1><div class="sub" id="sub">chargement…</div></div>
  <div class="stats">
    <div class="stat down zero" id="sdown"><b>0</b><span>En panne</span></div>
    <div class="stat warn zero" id="swarn"><b>0</b><span>Alerte</span></div>
    <div class="stat ok" id="sok"><b>0</b><span>En ligne</span></div>
  </div>
  <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
</header>
<main>
  <div id="banner"></div>
  <div id="incident"></div>
  <section id="probwrap"><div class="sec red" id="probtitle"></div><div id="problems"></div></section>
  <section id="ackwrap" style="display:none"><div class="sec" id="acktitle"></div><div id="acked"></div></section>
  <div id="allgood"><b>TOUS LES SYSTÈMES OPÉRATIONNELS</b><span>aucun incident en cours</span></div>
  <section id="okwrap"><div class="sec" id="oktitle"></div><div class="groups" id="groups"></div></section>
</main>
<footer>
  <div class="k"><span>Disponibilité 24 h</span><b id="f-up">–</b></div>
  <div class="k"><span>Réponse moyenne</span><b id="f-avg">–</b></div>
  <div class="k"><span>Le plus lent</span><b id="f-slow">–</b></div>
  <div class="k"><span>Moins disponible 24 h</span><b id="f-worst">–</b></div>
  <div class="sp"></div>
  <div class="k"><span>Mise à jour</span><b><i class="live" id="live"></i><em id="f-upd" style="font-style:normal">–</em></b></div>
</footer>
</section>

<section class="page" id="page-nearby">
  <header>
    <div class="titles"><h1>Autour de moi</h1><div class="sub" id="nb-sub">services à proximité</div></div>
    <div class="clock"><b id="time2">--:--</b><span id="date2"></span></div>
  </header>
  <main id="nb-main"><div class="placeholder" id="nb-msg">Chargement…</div><div id="nb-grid"></div></main>
</section>
</div>
<div id="dots"></div>
<script src="config.js"></script>
<script>
// config.js (voir config.example.js) définit window.WALLBOARD ; valeurs par défaut sinon
const CFG = Object.assign({ slug: "", title: "Pegase Monitoring", ignore: [], nearby: false, api: "/kuma" }, window.WALLBOARD || {});
const TITLE = CFG.title;
document.title = TITLE;
const REFRESH = 15000, STALE = 90000, C = 2 * Math.PI * 44;
const $ = id => document.getElementById(id);
if (!CFG.nearby) $("page-nearby").remove();  // page optionnelle (nécessite le serveur Python)
let known = new Set(), first = true, lastOk = 0, lastData = null;

// Acquittements : mémorisés par incident (id + début), donc conservés après rechargement,
// mais une nouvelle panne du même site redéclenche l'alerte.
const AK = "wallboard-acks";
let acks = new Set();
try { acks = new Set(JSON.parse(localStorage.getItem(AK) || "[]")); } catch (e) {}
const saveAcks = () => { try { localStorage.setItem(AK, JSON.stringify([...acks])); } catch (e) {} };
const key = m => m.id + "|" + m.since;
function setAck(keys, on) {
  keys.forEach(k => on ? acks.add(k) : acks.delete(k));
  saveAcks();
  if (lastData) render(lastData);
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const toMs = ts => Date.parse(ts.replace(" ", "T") + "Z");

function dur(ts) {
  const s = Math.max(0, Math.floor((Date.now() - toMs(ts)) / 1000));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = n => String(n).padStart(2, "0");
  return d ? `${d}j ${p(h)}h${p(m)}` : h ? `${h}h${p(m)}m${p(x)}s` : `${p(m)}m${p(x)}s`;
}

function stat(id, n, zeroable) {
  const e = $(id); e.querySelector("b").textContent = n;
  if (zeroable) e.classList.toggle("zero", n === 0);
}

function render(d) {
  $("title").textContent = TITLE;
  const ms = d.monitors;
  const down = ms.filter(m => m.status === 0).sort((a, b) => (a.since || "").localeCompare(b.since || ""));
  const warn = ms.filter(m => m.status === 2 || m.status == null);
  const maint = ms.filter(m => m.status === 3);
  const ok = ms.filter(m => m.status === 1);
  const total = ms.length || 1;

  const pct = Math.round(ok.length / total * 100);
  $("pct").textContent = pct + "%";
  $("fg").setAttribute("stroke-dasharray", `${C * ok.length / total} ${C}`);
  $("ring").className = "ring" + (down.length ? " bad" : (warn.length || maint.length) ? " warn" : "");
  $("sub").textContent = `${ms.length} services surveillés`;
  stat("sdown", down.length, true); stat("swarn", warn.length + maint.length, true); stat("sok", ok.length, false);

  const inc = $("incident");
  inc.style.display = d.incident ? "block" : "none"; inc.textContent = d.incident || "";

  const prob = $("problems"); prob.replaceChildren();
  const bads = [...down, ...warn, ...maint];
  const isAcked = m => m.status !== 3 && acks.has(key(m));
  const active = bads.filter(m => !isAcked(m));
  const acked = bads.filter(isAcked);

  // oublie les acquittements d'incidents terminés
  const live = new Set(bads.map(key));
  let pruned = false;
  for (const k of [...acks]) if (!live.has(k)) { acks.delete(k); pruned = true; }
  if (pruned) saveAcks();

  const showGroup = new Set(ms.map(m => m.group)).size > 1;
  const nowKnown = new Set();
  for (const m of active) {
    nowKnown.add(m.id);
    const kind = m.status === 0 ? "" : m.status === 3 ? " maint" : " warn";
    const c = el("div", "card" + kind + (!first && !known.has(m.id) ? " fresh" : ""));
    c.append(el("div", "tag", m.status === 0 ? "● Hors ligne" : m.status === 3 ? "● Maintenance" : "● En attente"));
    c.append(el("div", "n", m.name));
    if (showGroup && m.group) c.append(el("div", "grp", m.group));
    if (m.msg) c.append(el("div", "m", m.msg));
    if (m.since) { const t = el("div", "dur", dur(m.since)); t.dataset.since = m.since; c.append(t); }
    if (m.history && m.history.length) {
      const h = el("div", "hist");
      for (const s of m.history) h.append(el("i", s === 1 ? "u" : s === 0 ? "d" : s === 2 ? "p" : s === 3 ? "m" : ""));
      c.append(h);
    }
    if (m.status !== 3) {
      const b = el("button", "ack", "✓  OK, VU");
      b.addEventListener("click", () => setAck([key(m)], true));
      c.append(b);
    }
    prob.append(c);
  }
  // nouvelle panne non acquittée : on ramène l'écran sur la page de statut
  if (!first && active.some(m => m.status === 0 && !known.has(m.id))) goPage(0);
  prob.classList.toggle("dense", active.length > 4);
  known = nowKnown; first = false;

  // l'alerte globale ne reste que pour les pannes non acquittées
  document.body.classList.toggle("alert", active.some(m => m.status === 0));

  $("probwrap").style.display = active.length ? "block" : "none";
  const pt = $("probtitle"); pt.textContent = `Incidents · ${active.length}`;
  // incidents acquittés : puces discrètes, un tap les réactive
  const ak = $("acked"); ak.replaceChildren();
  for (const m of acked) {
    const chip = el("div", "chip" + (m.status === 0 ? "" : " warn"));
    chip.append(el("b", null, m.name));
    if (m.since) { const t = el("i", null, dur(m.since)); t.dataset.since = m.since; chip.append(t); }
    chip.append(el("span", null, "✓ vu"));
    chip.addEventListener("click", () => setAck([key(m)], false));
    ak.append(chip);
  }
  $("ackwrap").style.display = acked.length ? "block" : "none";
  $("acktitle").textContent = `Acquittés · ${acked.length} (toucher pour réactiver)`;
  $("allgood").style.display = bads.length ? "none" : "block";

  // OK, regroupés par groupe de la page de statut
  const by = new Map();
  for (const m of ok) { if (!by.has(m.group)) by.set(m.group, []); by.get(m.group).push(m); }
  const g = $("groups"); g.replaceChildren();
  const many = by.size > 1;
  for (const [name, list] of [...by].sort((a, b) => a[0].localeCompare(b[0]))) {
    const box = el("div");
    if (many && name) box.append(el("div", "gname", `${name} · ${list.length}`));
    const t = el("div", "tiles");
    const had = m => (m.history || []).includes(0) || (m.uptime24 != null && m.uptime24 < 0.9999);
    for (const m of list.sort((a, b) => (had(b) - had(a)) || a.name.localeCompare(b.name))) {
      const h = had(m);
      const tile = el("div", "tile" + (h ? " had" : "")); tile.append(el("span", null, m.name));
      if (m.uptime24 != null && m.uptime24 < 0.9999) {
        const u = Math.floor(m.uptime24 * 1000) / 10;  // arrondi vers le bas : jamais de faux "100 %"
        tile.append(el("small", u < 99 ? "bad" : "", u.toFixed(1).replace(".", ",") + "%"));
      }
      if (m.history && m.history.length) {
        const bar = el("div", "th");
        for (const s of m.history) bar.append(el("i", s === 0 ? "d" : s === 2 ? "p" : s === 3 ? "m" : ""));
        tile.append(bar);
      }
      tile.title = m.name + (m.ping != null ? ` – ${m.ping} ms` : "") +
        (m.uptime24 != null ? ` – dispo 24 h : ${(m.uptime24 * 100).toFixed(2)} %` : "");
      t.append(tile);
    }
    box.append(t); g.append(box);
  }
  // barre d'infos du bas
  const ups = ms.filter(m => m.uptime24 != null);
  if (ups.length) {
    const avgUp = ups.reduce((s, m) => s + m.uptime24, 0) / ups.length * 100;
    const f = $("f-up"); f.textContent = avgUp.toFixed(2) + " %";
    f.className = avgUp >= 99.9 ? "good" : avgUp >= 99 ? "mid" : "bad";
    const w = ups.reduce((a, b) => (b.uptime24 < a.uptime24 ? b : a));
    $("f-worst").textContent = w.uptime24 < 1 ? `${w.name} · ${(w.uptime24 * 100).toFixed(1)} %` : "aucun incident";
  }
  const pings = ok.filter(m => m.ping != null && m.ping > 0);
  if (pings.length) {
    $("f-avg").textContent = Math.round(pings.reduce((s, m) => s + m.ping, 0) / pings.length) + " ms";
    const s = pings.reduce((a, b) => (b.ping > a.ping ? b : a));
    $("f-slow").textContent = `${s.name} · ${s.ping} ms`;
  }
  $("f-upd").textContent = new Date().toLocaleTimeString("fr-FR");

  $("oktitle").textContent = `Opérationnels · ${ok.length}`;
  $("okwrap").style.display = ok.length ? "block" : "none";
  fitTiles();
}

// taille des tuiles : la plus grande qui tient dans la place restante (recalculée à chaque rendu)
function fitTiles() {
  const wrap = $("okwrap"), g = $("groups");
  if (wrap.style.display === "none") return;
  const avail = wrap.clientHeight - $("oktitle").offsetHeight - 12;
  const fits = px => { g.style.fontSize = px + "px"; return g.offsetHeight <= avail; };
  let lo = 9, hi = 30;
  if (fits(hi)) return;
  for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
  g.style.fontSize = lo + "px";
}
addEventListener("resize", fitTiles);

async function getJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// Équivalent navigateur de l'ancien /data du serveur Python : fusionne page de statut + heartbeats.
async function loadData() {
  const base = `${CFG.api}/api/status-page`;
  const [page, hb] = await Promise.all([getJson(`${base}/${CFG.slug}`), getJson(`${base}/heartbeat/${CFG.slug}`)]);
  const ignore = new Set((CFG.ignore || []).map(n => n.trim().toLowerCase()));
  const monitors = [];
  for (const g of page.publicGroupList || []) {
    for (const m of g.monitorList || []) {
      // monitors de type "groupe" : ignorés, seul l'enfant en cause doit apparaître
      if (m.type === "group" || ignore.has((m.name || "").trim().toLowerCase())) continue;
      const beats = (hb.heartbeatList || {})[String(m.id)] || [];
      const last = beats[beats.length - 1];
      const msg = (last && last.msg) || "";
      if (msg.startsWith("Child inaccessible") || msg.startsWith("All children up")) continue;
      let since = null;  // début de l'état en cours
      if (last) {
        since = last.time;
        for (let i = beats.length - 1; i >= 0 && beats[i].status === last.status; i--) since = beats[i].time;
      }
      monitors.push({
        id: m.id, name: m.name || "?", group: g.name || "",
        status: last ? last.status : null, msg, ping: last ? last.ping : null, since,
        uptime24: (hb.uptimeList || {})[`${m.id}_24`],
        history: beats.slice(-60).map(b => b.status),
      });
    }
  }
  return { title: TITLE, monitors, incident: page.incident ? page.incident.title : null };
}

async function tick() {
  try {
    lastData = await loadData();
    render(lastData);
    lastOk = Date.now(); $("banner").style.display = "none"; $("live").classList.remove("stale");
  } catch (e) {
    $("live").classList.add("stale");
    if (Date.now() - lastOk > STALE) {
      $("banner").style.display = "block";
      $("banner").textContent = "⚠ DONNÉES INDISPONIBLES – Kuma injoignable ou wallboard coupé";
    }
  }
}

// ---- page "Autour de moi" ----
const fmtDist = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace(".", ",")} km`;
function renderNearby(d) {
  const msg = $("nb-msg"), grid = $("nb-grid");
  if (d.error) { msg.style.display = "block"; msg.textContent = d.error; grid.replaceChildren(); return; }
  msg.style.display = "none"; grid.replaceChildren();
  $("nb-sub").textContent = `${d.open_now} ouvert${d.open_now > 1 ? "s" : ""} maintenant`;
  for (const c of d.categories) {
    const card = el("div", "nb-card" + (c.open ? " has" : ""));
    const h = el("div", "nb-h"); h.append(el("span", null, c.emoji), el("span", null, c.label));
    h.append(el("em", null, c.open ? `${c.open} ouvert${c.open > 1 ? "s" : ""}` : "fermé"));
    card.append(h);
    for (const p of c.places) {
      const r = el("div", "nb-r " + p.state);
      r.append(el("span", "nm", p.name), el("span", "ds", p.dist ? fmtDist(p.dist) : ""), el("span", "tx", p.text));
      card.append(r);
    }
    grid.append(card);
  }
}
async function tickNearby() {
  try {
    const r = await fetch("/nearby", { cache: "no-store" });
    const d = await r.json();
    renderNearby(r.ok ? d : { error: d.error || "Données indisponibles" });
    if (d.loading) setTimeout(tickNearby, 10000);  // chargement initial : on réessaie vite
    if (d.partial) $("nb-sub").textContent += " · données partielles";
  } catch (e) { /* on garde l'affichage précédent */ }
}
if (CFG.nearby) { tickNearby(); setInterval(tickNearby, 60000); }

function clock() {
  const n = new Date();
  $("time").textContent = n.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = n.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  if ($("time2")) { $("time2").textContent = $("time").textContent; $("date2").textContent = $("date").textContent; }
  document.querySelectorAll("[data-since]").forEach(e => e.textContent = dur(e.dataset.since));
}
// ---- pages ----
const pager = $("pager"), pages = [...document.querySelectorAll(".page")], dotsEl = $("dots");
let cur = 0, lastTouch = Date.now();
function goPage(i) { pager.scrollTo({ left: i * pager.clientWidth, behavior: "smooth" }); }
pages.forEach((_, i) => { const d = document.createElement("i"); d.addEventListener("click", () => goPage(i)); dotsEl.append(d); });
function syncDots() {
  cur = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
  [...dotsEl.children].forEach((d, i) => d.classList.toggle("on", i === cur));
}
dotsEl.style.display = pages.length > 1 ? "flex" : "none";
pager.addEventListener("scroll", () => { syncDots(); lastTouch = Date.now(); }, { passive: true });
addEventListener("resize", () => pager.scrollTo({ left: cur * pager.clientWidth }));
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") goPage(Math.min(pages.length - 1, cur + 1));
  if (e.key === "ArrowLeft") goPage(Math.max(0, cur - 1));
});
["touchstart", "mousedown", "keydown"].forEach(ev => addEventListener(ev, () => lastTouch = Date.now(), { passive: true }));
// retour automatique à la page de statut après 90 s sans interaction
setInterval(() => { if (cur !== 0 && Date.now() - lastTouch > 90000) goPage(0); }, 5000);
syncDots();

// curseur masqué après 3 s d'inactivité (écran tactile / kiosque)
let idleT; const idle = () => document.body.classList.add("idle");
["mousemove", "mousedown"].forEach(ev => addEventListener(ev, () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(idle, 3000); }));
idleT = setTimeout(idle, 3000);

setInterval(clock, 1000); clock();
tick(); setInterval(tick, REFRESH);
</script>

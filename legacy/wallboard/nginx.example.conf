# Site statique (index.html + config.js) + proxy vers l'API publique de ta page de statut Kuma.
# Le proxy rend les appels "même origine" : aucun CORS à configurer sur Kuma.
#
# Forge : crée un site "Static HTML" (domaine ex. wall.tondomaine.com), SSL Let's Encrypt, puis
# "Edit Nginx Configuration" et ajoute ce bloc `location` dans le `server { ... }` existant.

location /kuma/api/status-page/ {
    # seulement l'API publique des pages de statut, rien d'autre de Kuma
    proxy_pass https://monitoring.pegase.io/api/status-page/;
    proxy_ssl_server_name on;
    proxy_set_header Host monitoring.pegase.io;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;

    # le JSON des heartbeats pèse ~300 Ko : la compression le divise environ par 10
    gzip on;
    gzip_types application/json;
    gzip_proxied any;
    proxy_set_header Accept-Encoding "";
}

# La page n'a de sens que pour toi : protège-la (au choix, Forge > Security Rules = mot de passe),
# ou limite à l'IP publique de l'écran :
#   allow 203.0.113.10;   # IP de la Pi / du bureau

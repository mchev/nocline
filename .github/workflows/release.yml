name: release

# Push a tag vX.Y.Z (VERSION file must match) → build nocline-agent and attach Linux binaries to the GitHub release.
# To fix an empty release: Actions → release → Run workflow → enter the tag (e.g. v0.1.0).
#
# Asset uploads use `gh release upload` with retries: GitHub's uploads API sometimes 502s with
# "Error creating policy" (transient). Uploading via the CLI avoids aborting the whole release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach assets (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}

      - name: Check VERSION matches the tag
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${{ steps.tag.outputs.name }}"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Build the agent
        run: NOCLINE_AGENT_BINARY_DIR="$PWD/dist" scripts/build-agent.sh

      - name: SHA256 checksums
        run: |
          for arch in amd64 arm64; do
            sha256sum "dist/nocline-agent-linux-$arch" | awk '{print $1}' >"dist/nocline-agent-linux-$arch.sha256"
          done

      - name: Verify agent binaries
        run: |
          for arch in amd64 arm64; do
            file="dist/nocline-agent-linux-$arch"
            test -f "$file"
            test "$(stat -c%s "$file")" -gt 1000000
          done

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Nocline ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false

      - name: Upload agent binaries (retry GitHub upload transients)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          files=(
            dist/nocline-agent-linux-amd64
            dist/nocline-agent-linux-arm64
            dist/nocline-agent-linux-amd64.sha256
            dist/nocline-agent-linux-arm64.sha256
          )
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if gh release upload "$tag" "${files[@]}" --clobber; then
              gh release edit "$tag" --draft=false
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::upload attempt $attempt/$attempts failed; retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            fi
          done
          echo "::error::agent binary upload failed after $attempts attempts (release metadata may exist; re-run this workflow for the same tag)"
          exit 1
name: release

# Push a tag vX.Y.Z (VERSION file must match) → build nocline-agent and attach Linux binaries to the GitHub release.
# To fix an empty release: Actions → release → Run workflow → enter the tag (e.g. v0.1.0).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach assets (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}

      - name: Check VERSION matches the tag
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${{ steps.tag.outputs.name }}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build the agent
        run: NOCLINE_AGENT_BINARY_DIR="$PWD/dist" scripts/build-agent.sh

      - name: SHA256 checksums
        run: |
          for arch in amd64 arm64; do
            sha256sum "dist/nocline-agent-linux-$arch" | awk '{print $1}' >"dist/nocline-agent-linux-$arch.sha256"
          done

      - name: Verify agent binaries
        run: |
          for arch in amd64 arm64; do
            file="dist/nocline-agent-linux-$arch"
            test -f "$file"
            test "$(stat -c%s "$file")" -gt 1000000
          done

      - name: Publish GitHub release with agent binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Nocline ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/nocline-agent-linux-amd64
            dist/nocline-agent-linux-arm64
            dist/nocline-agent-linux-amd64.sha256
            dist/nocline-agent-linux-arm64.sha256